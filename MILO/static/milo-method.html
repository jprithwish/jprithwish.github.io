:root{--ink:#101828;--ink-soft:#475467;--ink-faint:#667085;--rule:#e4e7ec;--tint:#f6f8fb;--accent:#e8710a;--accent-ink:#ad4a07}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.m{font-family:"Source Serif 4",STIXGeneral,serif;font-style:italic;font-size:1.08em}
#stage{position:relative;width:1120px;height:630px;background:#fff;overflow:hidden}
#steps{position:absolute;left:18px;top:18px;width:276px}
.step{border:1px solid var(--rule);border-radius:10px;padding:6px 11px 7px;margin-bottom:6px;background:#fff;cursor:pointer}
.step .n{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--ink-faint);display:flex;align-items:center;gap:6px;line-height:14px}
.step .n sub{font-size:.75em;line-height:0;vertical-align:-.2em;letter-spacing:0}
.step .n .o{font-family:"Source Serif 4",STIXGeneral,serif;font-style:italic;font-size:1.25em;letter-spacing:0}
.step .tag{font-size:9px;letter-spacing:.02em;font-weight:650;padding:0 6px;border-radius:5px;line-height:14px}
.tag.inner{background:#ece8fa;color:#4b3a8f}.tag.outer{background:#fbefc4;color:#6f5200}
.step .h{font-size:12.5px;font-weight:700;line-height:17px;margin-top:1px}
.step .d{font-size:11px;line-height:1.42;color:var(--ink-soft);overflow:hidden;max-height:0;opacity:0;margin:0 -1px;padding:0 1px}
.step .d>div{padding-top:3px}
.step .d sub{font-size:.72em;line-height:0;vertical-align:-.25em;font-family:"Source Serif 4",serif}
.step .d .m + sub{margin-left:-.25em}
.step .d sup{font-size:.72em;line-height:0;vertical-align:.4em;font-family:"Source Serif 4",STIXGeneral,serif}
.step .d .mv{border-radius:3px;padding:0 1px;margin:0 -1px}
#foot{position:absolute;left:18px;top:586px;width:276px}
#foot .brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
#foot .brand b{font-family:"Source Serif 4",serif;font-size:16px;font-weight:700;color:var(--accent-ink);letter-spacing:.02em}
#foot .brand span{font-size:10px;color:var(--ink-faint)}
#foot .bar{margin-top:5px;height:3px;border-radius:2px;background:#eef1f5;overflow:hidden}
#foot .bar i{display:block;height:100%;width:0;background:var(--accent)}
#diagram{position:absolute;left:310px;top:18px;width:792px;height:563px;border:1px solid var(--rule);border-radius:14px;background:#f6f8fb;overflow:hidden}
#diagram svg{display:block;width:100%;height:100%}
#legend{position:absolute;left:310px;top:588px;width:792px;height:24px;display:flex;justify-content:center;align-items:center;gap:14px;font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
#legend .it{display:flex;align-items:center;gap:5px}
#legend svg{display:block}
#fade{position:absolute;left:311px;top:19px;width:790px;height:561px;border-radius:13px;background:#f6f8fb;opacity:0;pointer-events:none}
/* live (interactive) mode: scaled to the window, click steps or diagram boxes; capture mode is unchanged */
#ctl{display:none}
html.live,html.live body{height:100%;overflow:hidden;background:#fff}
html.live #stage{position:absolute;left:0;top:0;transform-origin:0 0}
html.live .step:hover{border-color:#f3b27a}
html.live .step:focus-visible{outline:2px dashed var(--ink-faint);outline-offset:2px}
html.live #foot .brand{display:none}
html.live #ctl{display:flex;align-items:center;gap:8px;height:20px}
#ctl button{display:inline-flex;align-items:center;gap:5px;font:650 10.5px Inter,sans-serif;color:var(--accent-ink);background:#fff;border:1px solid #f0c9a6;border-radius:6px;padding:2px 9px 2px 7px;cursor:pointer;flex:none}
#ctl button:hover{background:#fff4ea}
#ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#ctl svg{width:9px;height:9px;fill:currentColor}
#hint{font-size:10px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.live #foot .bar{cursor:pointer;height:15px;margin-top:1px;border:solid transparent;border-width:5px 0;background-clip:padding-box;border-radius:2px/7px;touch-action:none;user-select:none;-webkit-user-select:none}
html.live #foot .bar:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (pointer:coarse){html.live #foot{top:572px}html.live #ctl{height:32px}#ctl button{padding:7px 12px 7px 10px;font-size:12px}#ctl svg{width:10px;height:10px}}
</style>
</head>
<body>
<div id="stage">
  <div id="steps" role="group" aria-label="Steps of the method"></div>
  <div id="foot"><div id="ctl"><button id="pp" type="button"></button><span id="hint"></span></div><div class="brand"><b>MILO</b><span>Meta-evolutionary Island Orchestration</span></div><div class="bar"><i id="bar"></i></div></div>
  <div id="diagram"></div>
  <div id="legend"></div>
  <div id="fade"></div>

  ["blue", "green", "orange", "pink", "violet", "slate"].forEach((mu, i) => img(pool, "mutator", 842 + (i % 3 - 1) * 11 - 5, 370 + (i < 3 ? -13 : 0.5), 10, 12.5, { filter: robotF(mu) }));
  rich(rows[0].g, 817, 361, "{i:𝒢}", { size: 10.5, anchor: "end", fill: C.goldInk });
  img(rows[1].g, "bridge", 659, 420, 36, 14);
  const hexP = (x, y, r) => Array.from({ length: 6 }, (_, k) => { const a = Math.PI / 3 * k + Math.PI / 6; return (k ? "L" : "M") + f2(x + r * Math.cos(a)) + " " + f2(y + r * Math.sin(a)); }).join("") + "Z";
  el("path", { d: hexP(667, 513, 9.5), fill: ISL_T[1], stroke: ISL[1], "stroke-width": 1.3 }, rows[2].g);
  el("path", { d: hexP(691, 496, 6), fill: ISL_T[3], stroke: ISL[3], "stroke-width": 1.3 }, rows[2].g);
  el("path", { d: "M676 509L684 503", stroke: "#475467", "stroke-width": 1.3, "marker-end": "url(#a-gray)" }, rows[2].g);
  img(rows[3].g, "tasks", 663, 562, 26, 26);
  rows.forEach(r => r.g.appendChild(r.tag));
  UPD.push(t => {
    op(o2hl, win(t, 33.2, 44.4));
    rows.forEach((r, i) => {
      op(r.g, P(t, 33.3 + i * .1, 33.65 + i * .1));
      const [a, b] = MOVE_WIN[i], cw = CALLW[i], t0 = MOVE_WIN[i & ~1][0];
      const on = Math.max(win(t, a, b, .25), .45 * win(t, a, cw[1], .25), .18 * win(t, t0, cw[1], .25));
      r.r.setAttribute("fill", mix("#ffffff", C.goldFill, on)); r.r.setAttribute("stroke", mix("#e0e3e8", C.gold, on)); r.r.setAttribute("stroke-width", f2(1 + 1.2 * on));
      op(r.tag, win(t, t0, cw[1], .25));
    });
  });

  /* orchestrator feedback into the inner loop (gold dashed, like Figure 1) */
  const fb = (d, t0) => {
    const e = el("path", { d, fill: "none", stroke: C.gold, "stroke-width": 1.6, "stroke-dasharray": "5 3.5", "stroke-linecap": "round", "marker-end": "url(#a-gold)", opacity: 0 }, fx);
    const dot = el("circle", { r: 3.4, fill: C.gold, opacity: 0 }, fx);
    return { e, dot, t0 };
  };
  const fbF = fb("M645 71H614V40H258V127H250", 35.4);        // restructure memory  -> F
  const fbM = fb("M0 0", 33.6);                              // reassign mutators   -> m (tracks the mutator chip)
  const fbBgap = el("path", { d: "M620 330H611", stroke: "#fff", "stroke-width": 7, opacity: 0 }, fx);
  const fbB = fb("M645 598H628V330H606", 41.9);              // reshape curriculum  -> B_search
  const runDot = (f, a, b, t) => {
    if (t < a || t > b) return false;
    const L = f.e.getTotalLength(), p = f.e.getPointAtLength(ease(P(t, a, b)) * L);
    f.dot.setAttribute("cx", f2(p.x)); f.dot.setAttribute("cy", f2(p.y)); op(f.dot, 1); return true;
  };
  UPD.push(t => {
    const cyM = chipY(t) + 11;
    fbM.e.setAttribute("d", `M645 606H614V623H258V${f2(cyM)}H250`);
    const fin = stepOf(t) >= STEPS.length;
    op(fbBgap, P(t, 41.9, 42.2));
    [[fbF, [[35.4, 36.0], [39.5, 40.1]]], [fbM, [[33.6, 34.2], [41.1, 41.6]]], [fbB, [[41.9, 42.5]]]].forEach(([f, runs]) => {
      const base = P(t, f.t0, f.t0 + .3);
      const hot = runs.reduce((m, [a, b]) => Math.max(m, win(t, a, b + .3, .2)), 0);
      op(f.e, fin ? base : base * (.5 + .5 * hot));
      if (!runs.some(([a, b]) => runDot(f, a, b, t))) op(f.dot, 0);
    });
  });

  // Reassign: old mutator leaves to the pool, a different one arrives; Speciate brings one for island 4
  const outTok = el("g", { opacity: 0 }, tokL); img(outTok, "mutator", -18, -21, 36, 42, { filter: robotF(ASSIGN[2]) });
  const inTok = el("g", { opacity: 0 }, tokL); img(inTok, "mutator", -18, -21, 36, 42, { filter: robotF("pink") });
  const specTok = el("g", { opacity: 0 }, tokL); img(specTok, "mutator", -18, -21, 36, 42, { filter: robotF(ASSIGN[3]) });
  const slot3 = [46, LANE_Y(2) + 29], slot4 = [46, LANE_Y(3) + 29], poolC = [842, 370];
  UPD.push(t => {
    const mv = (g, a, b, t0, t1, s0, s1, lift) => {
      if (t < t0 || t > t1) { op(g, 0); return; }
      const u = ease(P(t, t0, t1)), p = arcPt(a, b, u, lift);
      g.setAttribute("transform", `translate(${f2(p[0])} ${f2(p[1])}) scale(${f2(lerp(s0, s1, u))})`); op(g, 1);
    };
    mv(outTok, slot3, poolC, 33.9, 34.5, 1, .35, -30);
    mv(inTok, poolC, slot3, 34.55, 35.15, .35, 1, -30);
    mv(specTok, poolC, slot4, 41.1, 41.7, .35, 1, -20);
  });
  const reHl = el("rect", { x: 25, y: LANE_Y(2) + 5, width: 42, height: 48, rx: 8, fill: "none", stroke: C.gold, "stroke-width": 2.2, opacity: 0 }, fx);
  UPD.push(t => op(reHl, pulse(t, 35.1, 35.8)));

  /* step 7 inspection glows: F (memory), m (mutators), B_search (curriculum), then island j* */
  const glow = (x, y, w, h, a, b) => { const r = el("rect", { x, y, width: w, height: h, rx: 12, fill: "none", stroke: C.gold, "stroke-width": 2.4, opacity: 0 }, fx); UPD.push(t => op(r, win(t, a, b, .25))); return r; };
  glow(17, 118, 234, 269, 29.2, 29.7);
  glow(23, 157, 46, 225, 29.6, 30.1);
  glow(19, 389, 230, 28, 29.6, 30.1);
  glow(491, 280, 110, 78, 30.0, 30.5);
  glow(18, 308, 232, 78, 30.4, 31.6);

  /* ---------- evolved agent (shown as a skeleton from the start) */
  const outCard = el("g", null, zout);
  el("rect", { x: 22, y: 516, width: 224, height: 70, rx: 12, fill: "#f3faf5", stroke: C.good, "stroke-opacity": .6, "stroke-width": 1.3 }, outCard);
  img(outCard, "model", 30, 528, 28, 25); img(outCard, "arm", 61, 526, 24, 28);
  const outH = img(outCard, "h_red", 90, 527, 23, 26, { opacity: 0 });
  const outStar = el("path", { d: starPath(0, 0, 5, 2.2), fill: C.gold, transform: "translate(112 529)", opacity: 0 }, outCard);
  rich(outCard, 123, 545, "Evolved agent", { size: 12, weight: 700 });
  const outTxt = el("g", { opacity: 0 }, outCard);
  rich(outTxt, 123, 564, "⟨{i:ℳ}, {i:h}^{*}⟩", { size: 13, serif: true });
  rich(outTxt, 123, 579, "max frontier gain on {i:ℬ}_{{s:val}}", { size: 9, fill: C.faint });
  rich(outCard, 239, 528, "OUTPUT", { size: 8, weight: 700, fill: C.good, anchor: "end", ls: ".1em" });
  const outHl = el("rect", { x: 20.5, y: 514.5, width: 227, height: 73, rx: 13, fill: "none", stroke: C.accent, "stroke-width": 2.2, opacity: 0 }, zout);
  const hTok = el("g", { opacity: 0 }, tokL); img(hTok, "h_red", -11.5, -13, 23, 26);
  UPD.push(t => {
    op(outTxt, P(t, 46.5, 47.0));
    op(outHl, win(t, 46.6, 49.6));
    if (t >= 46.8 && t < 47.65) {
      const v = ease(P(t, 46.8, 47.6)), p = arcPt(nodePos(N.c12, t), [101.5, 540], v, 60);
      hTok.setAttribute("transform", `translate(${f2(p[0])} ${f2(p[1])}) scale(${f2(lerp(.5, 1, v))})`); op(hTok, 1);
    } else op(hTok, 0);
    op(outH, t >= 47.6 ? 1 : 0); op(outStar, P(t, 47.6, 47.8));
  });

  /* ---------- zone opacity */
  UPD.push(t => { for (const k in Z) op(Z[k], zoneOpacity(k, t)); });
}

/* ============================================================ render */
function renderAt(disp) {
  disp = clamp(disp, 0, DURATION);
  const t = warp(disp);
  renderSteps(t, disp);
  for (const f of UPD) f(t);
  document.getElementById("fade").style.opacity = f2(Math.max(1 - P(t, 0, .4), P(t, FADE_A, FADE_B)));
}

async function preload() {
  const keys = ["stopwatch", "arm", "h_orange", "h_purple", "check", "mutator", "h_red", "tests", "tasks", "gauge", "clock", "coins", "bridge", "model", "hourglass", "select", "conductor", "pm"];
  await Promise.all(keys.map(k => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => res(); im.src = ASSET(k); })));
  await Promise.all(["400 12px Inter", "600 12px Inter", "700 12px Inter", "italic 12px 'Source Serif 4'", "12px 'Source Serif 4'", "700 16px 'Source Serif 4'"].map(f => document.fonts.load(f)));
  await document.fonts.ready;
}

/* ============================================================ live mode
   Opens on the complete figure, then loops. Clicking a step (left) or a box in the diagram plays that
   step and pauses at its end (clicking the same box again continues). Space/k toggles play, arrow keys
   move between steps (wrapping through the full view), the progress bar seeks and scrubs. Honors
   prefers-reduced-motion (paused on the full view; clicks jump to a step's end state), pauses while
   off-screen or in a background tab, and only schedules frames while something is animating. */
function startLive() {
  document.documentElement.classList.add("live");
  const reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const touch = !!(window.matchMedia && matchMedia("(hover: none)").matches);
  const stage = document.getElementById("stage");
  const fit = () => {
    const s = Math.min(innerWidth / 1120, innerHeight / 630) || 1;
    stage.style.transform = `translate(${f2((innerWidth - 1120 * s) / 2)}px,${f2(Math.max(0, (innerHeight - 630 * s) / 2))}px) scale(${s.toFixed(4)})`;
  };
  addEventListener("resize", fit); fit();
  const FULL = (DISP[9] + DISP[10]) / 2, FADE_IN_END = .4 * DISP[1] / TAU[1];
  let t = reduced ? FULL : DISP[9] + .5, hold = reduced ? 0 : 2.5;   // first look: the complete figure
  let playing = !reduced, stopAt = null, last = null, visible = true, dirty = true, raf = 0, scrub = false, curStep = -1;
  const pp = document.getElementById("pp"), hint = document.getElementById("hint");
  const ICON_PAUSE = '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.5" height="8" rx=".6"/><rect x="6" y="1" width="2.5" height="8" rx=".6"/></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.2v7.6L8.8 5z"/></svg>';
  const verb = touch ? "Tap" : "Click";
  const stepIdx = () => { for (let i = 0; i < 9; i++) if (t < DISP[i + 1]) return i; return 9; };
  const ui = () => {
    pp.innerHTML = (playing ? ICON_PAUSE : ICON_PLAY) + (playing ? "Pause" : "Play");
    pp.setAttribute("aria-label", playing ? "Pause the walkthrough" : "Play the walkthrough");
    hint.textContent = playing || stepIdx() >= 9 ? `${verb} a step or any box in the diagram`
      : stopAt != null ? "Paused · Play finishes this step" : `Paused · ${verb.toLowerCase()} the box again or Play to continue`;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
  const setPlaying = p => { playing = p; last = null; ui(); kick(); };
  // the components of the approach (viewBox units) -> the step that explains them
  const HOT = [
    [0, [16, 42, 236, 460], "Seed the islands: initial agent, lineage memory and mutators"],
    [1, [267, 44, 166, 191], "Stage 1 · Parent selection"],
    [2, [445, 44, 164, 191], "Stage 2 · Mutation"],
    [3, [445, 249, 164, 194], "Stage 3 · Fitness evaluation"],
    [4, [267, 249, 166, 194], "Stage 4 · Child acceptance"],
    [5, [267, 457, 342, 162], "Stage 5 · Progress monitoring"],
    [6, [643, 43, 238, 244], "𝒪₁ · Diagnose the stall"],
    [7, [643, 303, 238, 320], "𝒪₂ · Intervene"],
    [8, [19, 513, 230, 76], "Output · evolved agent"]
  ];
  // On phones the host page scrolls the 720px-wide figure sideways; bring the chosen part into view.
  const reveal = i => {
    let fe = null; try { fe = window.frameElement; } catch (e) { return; }
    const sc = fe && fe.closest && fe.closest(".figscroll");
    if (!sc || sc.scrollWidth <= sc.clientWidth + 1) return;
    const [x, , w] = HOT[i][1], r = document.querySelector("#diagram svg").getBoundingClientRect();
    const off = fe.getBoundingClientRect().left - sc.getBoundingClientRect().left + sc.scrollLeft;
    const L = i === 0 || i === 8 ? off : off + r.left + x / 900 * r.width, R = i === 0 || i === 8 ? off + r.left + 246 / 900 * r.width : L + w / 900 * r.width;
    const cur = sc.scrollLeft, cw = sc.clientWidth;
    if (L - 12 >= cur && R + 12 <= cur + cw) return;
    sc.scrollTo({ left: Math.max(0, Math.min(L - 12, R + 12 - cw)), behavior: reduced ? "auto" : "smooth" });
  };
  const goStep = i => {
    hold = 0; i = clamp(i, 0, 9); stopAt = null;
    if (i === 9) { if (reduced) { t = FULL; setPlaying(false); } else { t = DISP[9] + .001; stopAt = FULL; setPlaying(true); } }
    else if (reduced) { t = DISP[i + 1] - .02; setPlaying(false); }
    else { t = DISP[i] + .001; stopAt = DISP[i + 1] - .02; setPlaying(true); }
    dirty = true; kick();
    const ae = document.activeElement;   // keyboard focus follows the active step
    if (i < 9 && ae && ae.classList && ae.classList.contains("step") && ae !== STEP_EL[i].root) STEP_EL[i].root.focus({ preventScroll: true });
    if (i < 9) reveal(i);
  };
  window.__goStep = goStep;
  const toggle = () => {   // keeps a pending single-step stop; never freezes a loop-transition fade
    hold = 0;
    if (playing) {
      if (t > DISP[10]) { t = FULL; dirty = true; }
      else if (t < FADE_IN_END) { t = FADE_IN_END; dirty = true; }
    } else if (t >= DISP[10]) t = 0;
    setPlaying(!playing);
  };
  pp.addEventListener("click", toggle);
  // progress bar: click/drag to seek; a slider for keyboard and screen readers
  const bar = document.querySelector("#foot .bar");
  bar.tabIndex = 0; bar.setAttribute("role", "slider"); bar.setAttribute("aria-label", "Walkthrough position");
  bar.setAttribute("aria-valuemin", "0"); bar.setAttribute("aria-valuemax", "100");
  let ariaNow = -1;
  const syncAria = () => {
    const v = Math.round(100 * clamp(t / DISP[9])); if (v === ariaNow) return; ariaNow = v;
    const i = Math.min(stepIdx(), 8);
    bar.setAttribute("aria-valuenow", v); bar.setAttribute("aria-valuetext", `${v}% · step ${i + 1} of 9: ${STEPS[i].h}`);
  };
  const markCurrent = () => {
    const si = stepIdx(); if (si === curStep) return;
    if (STEP_EL[curStep]) STEP_EL[curStep].root.removeAttribute("aria-current");
    if (STEP_EL[si]) STEP_EL[si].root.setAttribute("aria-current", "step");
    curStep = si;
  };
  const seekTo = v => { hold = 0; t = clamp(v) * DISP[9]; stopAt = null; dirty = true; ui(); kick(); };
  const seekX = e => { const r = bar.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width); };
  bar.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault(); bar.focus({ preventScroll: true });
    bar.setPointerCapture(e.pointerId); scrub = true; seekX(e);
  });
  bar.addEventListener("pointermove", e => { if (scrub) seekX(e); });
  const endScrub = () => { scrub = false; last = null; kick(); };
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(k => bar.addEventListener(k, endScrub));
  bar.addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const cur = Math.min(t, DISP[9]) / DISP[9], d = 2 / DISP[9];
    const v = { ArrowLeft: cur - d, ArrowDown: cur - d, ArrowRight: cur + d, ArrowUp: cur + d, Home: 0, End: 1 }[e.key];
    if (v === undefined) return;
    e.preventDefault(); e.stopPropagation(); seekTo(v);
  });
  addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;   // leave browser/OS shortcuts alone (Alt/Cmd+Arrow, Ctrl+K, ...)
    const s = stepIdx();
    if (e.key === "ArrowRight") { e.preventDefault(); goStep(s >= 9 ? 0 : s + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goStep(s >= 9 ? 8 : Math.max(0, s - 1)); }
    else if (e.key === "k" || (e.key === " " && !(e.target && e.target.closest && e.target.closest("button,.step")))) {
      e.preventDefault(); if (e.repeat) return; toggle();
    }
  });
  const svg = document.querySelector("#diagram svg");
  const hov = el("rect", { rx: 13, fill: "none", stroke: C.accent, "stroke-width": 2, "stroke-dasharray": "6 4", opacity: 0, "pointer-events": "none" }, svg);
  HOT.forEach(([i, [x, y, w, h], label]) => {
    const r = el("rect", { x, y, width: w, height: h, rx: 13, fill: "transparent", style: "cursor:pointer" }, svg);
    el("title", { text: label + ` (${verb.toLowerCase()} to play this step)` }, r);
    r.addEventListener("mouseenter", () => { ["x", "y", "width", "height"].forEach((k, j) => hov.setAttribute(k, [x, y, w, h][j])); op(hov, .9); });
    r.addEventListener("mouseleave", () => op(hov, 0));
    r.addEventListener("click", () => {
      if (!playing && !reduced && stepIdx() === i && t >= DISP[i + 1] - .03) { hold = 0; setPlaying(true); }   // same box again: continue
      else goStep(i);
    });
  });
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; if (visible) kick(); }, { threshold: .1 }).observe(document.body);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
  function frame(now) {
    raf = 0;
    if (playing && visible && !document.hidden && !scrub) {
      if (last != null) { const dt = Math.min(.1, (now - last) / 1000); if (hold > 0) hold -= dt; else { t += dt; dirty = true; } }
      last = now;
      if (stopAt != null && t >= stopAt) { t = stopAt; stopAt = null; setPlaying(false); }
      if (t >= DURATION) t -= DURATION;
    } else last = null;
    if (dirty) { renderAt(t); dirty = false; syncAria(); markCurrent(); }
    if (playing && visible && !document.hidden) kick();
  }
  ui(); kick();
}

window.DURATION = DURATION;
window.renderAt = renderAt;
window.READY = (async () => {
  await preload();
  buildSteps();
  buildLegend();
  buildDiagram();
  renderAt(0);
  const m = location.search.match(/[?&]t=([\d.]+)/);
  if (m) { renderAt(+m[1]); return true; }
  if (!/[?&]capture/.test(location.search)) startLive();
  return true;
})();
})();
</script>
